
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebolt JSSDK Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'Arial', sans-serif;
      background: #f6f8fa;
      color: #24292f;
      padding: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      color: #003d82;
      font-weight: bold;
      font-size: 2rem;
      border-bottom: 2px solid #d0d7de;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    h2 {
      color: #003d82;
      font-weight: bold;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0 8px;
    }

    /* ── Status log ─────────────────────────────────────────────────────────── */
    #log-panel {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 12px 16px;
      max-height: 220px;
      overflow-y: auto;
      font-size: 1.5rem;
    }

    .log-entry { padding: 2px 0; line-height: 1.5; }
    .log-info   { color: #000000; }
    .log-retry  { color: #d29922; font-weight: bold; }
    .log-success{ color: #2da44e; font-weight: bold; }
    .log-error  { color: #d1242f; font-weight: bold; }

    /* ── Results table ──────────────────────────────────────────────────────── */
    #results-panel {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow-y: auto;
      max-height: 400px;
      font-size: 1.75rem;
    }

    #results-panel .placeholder {
      padding: 20px;
      color: #6e7681;
      font-style: italic;
      font-size: 1.5rem;
    }

    .result-row {
      display: flex;
      align-items: flex-start;
      border-bottom: 1px solid #d0d7de;
    }
    .result-row:last-child { border-bottom: none; }
    .result-row:nth-child(odd)  { background: #f6f8fa; }
    .result-row:nth-child(even) { background: #ffffff; }

    .result-method {
      flex: 0 0 340px;
      padding: 8px 14px;
      color: #000000;
      font-weight: bold;
      word-break: break-all;
      border-right: 1px solid #d0d7de;
    }

    .result-value {
      flex: 1;
      padding: 8px 14px;
      color: #000000;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .result-value.null-val  { color: #000000; }
    .result-value.error-val { color: #d1242f; font-weight: bold; }

    /* ── Summary bar ────────────────────────────────────────────────────────── */
    #summary {
      margin-top: 14px;
      padding: 10px 16px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 1.5rem;
      display: none;
    }
    #summary .ok  { color: #2da44e; font-weight: bold; }
    #summary .err { color: #d1242f; font-weight: bold; }

    /* ── TV Remote Navigation Buttons ─────────────────────────────────────── */
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      flex: 0 1 180px;
      padding: 16px 20px;
      background: #f6f8fa;
      border: 2px solid #d0d7de;
      border-radius: 6px;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'Arial', sans-serif;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #e1e4e8;
      border-color: #000000;
      color: #000000;
      font-weight: bold;
    }

    .nav-btn:focus {
      outline: none;
      background: #ffffff;
      border-color: #000000;
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.2);
    }

    .nav-btn:active {
      background: #161b22;
      transform: scale(0.98);
    }

    .section-with-controls {
      margin-bottom: 24px;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h2::after {
      content: '';
      flex: 1;
    }

    .control-buttons {
      display: flex;
      gap: 8px;
    }

    .control-buttons .nav-btn {
      flex: 0 1 auto;
      padding: 12px 16px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Firebolt JSSDK Test</h1>

  <div class="section-with-controls">
    <h2>
      Status Log
      <div class="control-buttons">
        <button id="log-up-btn" class="nav-btn">↑ Top</button>
        <button id="log-down-btn" class="nav-btn">↓ Bottom</button>
      </div>
    </h2>
    <div id="log-panel"></div>
  </div>

  <div class="section-with-controls">
    <h2>
      Method Results
      <div class="control-buttons">
        <button id="results-up-btn" class="nav-btn">↑ Top</button>
        <button id="results-down-btn" class="nav-btn">↓ Bottom</button>
      </div>
    </h2>
    <div id="results-panel">
      <div class="placeholder">Waiting for FireboltServiceManager&hellip;</div>
    </div>
  </div>

  <div id="summary"></div>
  <script type="module">
    import { run } from './index.js';
    run();
  </script>
</body>
</html>
